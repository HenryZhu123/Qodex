<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>408 自主命题试题台</title>
  <link rel="stylesheet" href="/ui.css">
  <script src="/author.js" defer></script>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <nav class="workbench-nav" aria-label="验证模式">
        <span class="eyebrow">QODEX / 408</span>
        <a href="/rules">规则题验证台 ↗</a>
      </nav>
      <h1>自主命题试题台</h1>
      <p class="subtitle">像考生一样提需求，像命题教师一样看题面、答案和评分。</p>
      <div class="tags"><span id="provider-label">正在读取运行配置</span><span id="knowledge-label" hidden></span><span>本机预览 · 单次一题</span></div>
    </div>
  </header>
  <main class="wrap workspace author-workspace">
    <section class="panel controls" aria-labelledby="input-title">
      <h2 id="input-title">你想出什么题？</h2>
      <form id="author-form">
        <fieldset id="author-controls" disabled>
          <label class="author-label" for="brief">命题需求</label>
          <textarea id="brief" name="brief" rows="5" maxlength="2000" placeholder="比如：想练内存这块，考查为什么增加页框后缺页次数反而变多。"></textarea>
          <p class="muted">留空时，由模块选择考点。</p>
          <div class="presets brief-presets" aria-label="填入示例需求">
            <button type="button" data-brief="想练内存这块">内存</button>
            <button type="button" data-brief="用最少的边保证拓扑序唯一">拓扑序</button>
            <button type="button" data-brief="信道容量与码元电平，考查哪个限制先起作用">信道容量</button>
          </div>
          <details class="author-input-details">
            <summary>粘贴参考材料</summary>
            <label class="author-label" for="material">参考材料原文</label>
            <textarea id="material" name="material" rows="6" maxlength="12000" placeholder="粘贴教材、讲义或自己的笔记。"></textarea>
            <label class="author-label" for="source">材料来源（可选）</label>
            <input id="source" name="source" type="text" maxlength="200" placeholder="例如：操作系统讲义，第 6 章">
          </details>
          <details class="author-input-details">
            <summary>指定科目或题型</summary>
            <div class="fields author-fields">
              <label>科目<select name="subject">
                <option value="">由模块决定</option><option value="data_structures">数据结构</option>
                <option value="computer_organization">计算机组成原理</option><option value="operating_systems">操作系统</option>
                <option value="computer_networks">计算机网络</option>
              </select></label>
              <label>题型<select name="question_type"><option value="">由模块决定</option><option value="single_choice">单选题</option><option value="comprehensive">综合题</option></select></label>
            </div>
          </details>
          <label id="cloud-label" class="cloud-confirm" hidden><input id="cloud-confirmed" type="checkbox"> 同意本次将需求与材料发给 DeepSeek，最多 4 次模型调用，可能产生费用。</label>
          <button id="generate-author" type="submit" class="primary">生成试题</button>
          <button id="history-example" type="button" class="history-button" hidden>查看历史实测样题</button>
        </fieldset>
      </form>
    </section>
    <section class="panel result" aria-labelledby="preview-title">
      <div class="result-heading">
        <h2 id="preview-title">试题预览</h2>
        <output id="author-status" class="status" aria-live="polite">等待输入</output>
      </div>
      <p id="author-message" class="muted" aria-live="polite">提交需求后，先看学生题面，再展开教师解答。</p>
      <div id="author-question" hidden>
        <p id="question-meta" class="section-label"></p>
        <p id="author-stem" class="stem prose"></p>
        <ol id="author-parts" class="question-parts"></ol>
        <details id="author-teacher"><summary>教师答案与评分</summary><div id="author-solutions"></div></details>
      </div>
      <details id="author-design" hidden><summary>考查计划、材料与自检</summary><div id="author-diagnostics"></div></details>
      <details id="author-raw" hidden><summary>查看完整结果</summary><pre id="author-json"></pre></details>
    </section>
    <footer class="scope">试题台调用自主命题模块，预览结果留在本机。模型题仍需独立审校。</footer>
  </main>
</body>
</html>
